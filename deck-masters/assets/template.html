<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>deck-masters</title><style>
:root{--bg:#fafafa;--bottom:#efeff1;--card:#fff;--t1:#18181b;--t2:#3f3f46;--t3:#52525b;--t4:#71717a;--t5:#a1a1aa;--accent:#3d8bff;--dark:#101014}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--t1)}body{overflow:hidden}
.deck{transform-origin:0 0}.slide{position:relative;width:1920px;height:1080px;overflow:hidden;break-after:page;background:var(--bg)}.page{position:absolute;inset:0;padding:90px 120px}
.bottom{position:absolute;left:120px;right:120px;bottom:90px;top:236px;background:var(--bottom);border:2px solid #e4e4e7;border-radius:44px;box-shadow:0 18px 40px rgba(24,24,27,.06),0 2px 0 rgba(255,255,255,.7) inset}
.card{background:var(--card);border:2px solid #e5e7eb;border-radius:28px;box-shadow:0 18px 36px rgba(24,24,27,.08),0 2px 0 rgba(255,255,255,.9) inset}
.cover,.section,.statement,.ending{background:var(--bg);color:var(--t5)}
.cover .page,.section .page,.statement .page,.ending .page{padding:90px 120px}
.kicker,.pageNo,.caption{font-size:30px;line-height:44px;color:var(--t5)}.label{font-size:26px;line-height:36px;font-weight:500}.num{font-size:26px;line-height:36px;font-weight:600}.body{font-size:38px;line-height:56px;font-weight:400}.strong{font-size:38px;line-height:56px;font-weight:500}.heading{font-size:44px;line-height:56px;font-weight:500}.title{font-size:64px;line-height:76px;font-weight:600}.display{font-size:120px;line-height:132px;font-weight:600}.metric{font-size:150px;line-height:160px;font-weight:600}.muted{color:var(--t4)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}.accent{color:var(--accent)}.warn{outline:3px dashed #ef4444;outline-offset:6px}.topline{display:flex;justify-content:space-between;align-items:flex-start}.pageNo{position:absolute;right:120px;bottom:90px}.tocList{margin-top:60px;display:grid;gap:26px}.tocItem{display:flex;align-items:flex-start;gap:18px;font-size:38px;line-height:56px}.tocDot{width:14px;height:14px;border-radius:999px;background:#d4d4d8;flex:0 0 auto;margin-top:22px}.tocItem.active .tocDot{background:var(--accent)}.tocItem.active{color:var(--t1)}.cols{display:grid;gap:32px}.bullets{display:grid;gap:28px;margin-top:36px}.bullet{padding:28px 30px}.bullet .label{display:block;margin-bottom:8px}.statWrap{display:flex;justify-content:center;align-items:center;height:100%}.statBox{max-width:1200px;text-align:center}.statBox .strong{display:block}.statBox .caption{display:block;margin-top:26px}.dataGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;height:100%}.dataCard{padding:44px 36px;display:flex;flex-direction:column;justify-content:space-between}.dataCard .metric{color:var(--t1)}.dataCard .metric.hot{color:var(--accent)}.chartBox{padding:40px;height:100%;display:flex;flex-direction:column}.chartSvg{width:100%;height:610px;display:block}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:32px;height:100%}.compareCol{padding:40px 38px;display:flex;flex-direction:column}.compareCol h3{margin:0 0 24px;font-size:44px;line-height:56px;font-weight:500}.compareCol ul{margin:0;padding:0;list-style:none;display:grid;gap:18px}.compareCol li{font-size:38px;line-height:56px;display:flex;gap:14px}.compareCol li:before{content:"•";color:#a1a1aa}.compareCol.right li:before{color:#a1a1aa}.compareCol.right{border-color:var(--accent)}.compareFoot{margin-top:auto;padding-top:22px;border-top:2px solid #e4e4e7;font-size:38px;line-height:56px;font-weight:500;color:var(--t1)}.splitGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;height:100%}.splitArt{padding:28px;display:flex;align-items:center;justify-content:center;min-height:0}.splitPh{width:100%;height:100%;border:2px dashed #d4d4d8;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--t4);font-size:38px;line-height:56px}.coverTitle{margin-top:120px;max-width:1200px}.coverSub{margin-top:34px}.coverInfo{position:absolute;left:120px;bottom:90px;font-size:30px;line-height:44px;color:#c7c7d1}.sectionNo{font-size:120px;line-height:132px;font-weight:600;color:var(--accent)}.sectionTitle{margin-top:30px;font-size:64px;line-height:76px;font-weight:600}.sectionLead{margin-top:24px;font-size:38px;line-height:56px;color:#cfcfd8}.endingMain{margin-top:170px;max-width:1200px}.endingSub{margin-top:34px;font-size:44px;line-height:56px;color:#d4d4d8}.endingLink{position:absolute;left:120px;bottom:90px;font-size:38px;line-height:56px;color:#f4f4f5}.section .pageNo,.statement .pageNo,.ending .pageNo{color:#71717a}
.cover,.statement,.ending{color:var(--t1)}.section{background:#101014;color:#f2f2f0}.coverInfo{color:var(--t4)}.sectionNo{font-size:150px;line-height:160px}.sectionTitle{font-size:120px;line-height:132px}.bullet .label.strong{font-size:38px;line-height:56px;font-weight:500;color:var(--t1)}.bullet .body{color:var(--t3)}.compareGrid{height:600px}.compareCol{height:100%}.compareFoot{margin-top:30px;padding-top:24px;border-top:2px solid #e4e4e7;font-size:38px;line-height:56px;font-weight:500;color:var(--t1)}.endingSub{color:var(--t3)}.endingLink{color:var(--t4)}</style></head><body><div id="deck" class="deck"></div><script>
const DATA={theme:"light",accent:"#3d8bff",presenter:"SkyDreamk",pages:[{type:"cover",title:"把 Logo 画成竖线",subtitle:"不用一张图片的品牌卡片，纯 Canvas 实现",info:"SkyDreamk · 项目分享 · 2026-10-21"},{type:"toc",title:"这套东西讲什么",items:["01 线为什么能成图（先讲清亮度表）","02 四步管线（从采样到动效）","03 三个品牌实测（真实路径数据）","04 垫图的坑（为什么不用底图）"]},{type:"section",no:"01",title:"先讲原理",lead:"理解亮度表，后面全通"},{type:"statement",main:"Logo 本身 / 就该是线画的",note:"垫图是对位游戏，线画是一体成型"},{type:"bullets",title:"四步管线",items:[["离屏画图","先把 Logo 画到离屏画布上"],["切格采样","按格子采样每格平均亮度"],["竖线查表","每根线按亮度选四档线宽"],["叠加动效","噪声浮动，加悬停散开和检测框"]]},{type:"data",items:[["48","竖线根数"],["4","线宽档位"],["0","使用的图片"]],hot:2},{type:"chart",title:"三个品牌，路径长短差一倍",labels:["华为","理想","小米"],values:[1213,658,793],note:"华为花瓣最复杂，字符数是理想的 1.8 倍"},{type:"compare",leftTitle:"底下垫图",left:["线图两层皮","一动就错位","缩放必糊","维护两套资产"],rightTitle:"Logo 即线",right:["只有一层线","动起来不错位","任意缩放都锐利","改参数即出图"],note:"线就是图，所以不错位"},{type:"split",title:"成品长这样",lines:["红底白线是华为花瓣","黑底银线是理想车标","米白橙线是小米 MI","悬停时线会散开并弹出检测框"]},{type:"ending",main:"模板已开源",sub:"换个 Logo，改个色，就是你的卡片墙",link:"github.com/SkyDreamk/line-logo-cards"}]};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const chk=(s,n,c)=>{if(String(s).length>n)console.warn("text overflow",s);return `<span class="${c} ${String(s).length>n?'warn':''}">${esc(s)}</span>`};
const cover=p=>`<section class="slide cover"><div class="page"><div class="coverTitle">${chk(p.title,16,"display")}</div><div class="coverSub">${chk(p.subtitle,24,"heading")}</div><div class="coverInfo">${esc(p.info)}</div></div></section>`;
const toc=p=>`<section class="slide"><div class="page"><div class="topline"><div class="title">${chk(p.title,14,"title")}</div><div></div></div><div class="bottom"></div><div class="page" style="padding-top:236px"><div class="tocList">${p.items.map((t,i)=>`<div class="tocItem ${i===0?"active":""}"><div class="tocDot"></div><div>${esc(t)}</div></div>`).join("")}</div></div><div class="pageNo">2 / 10</div></section>`;
const section=p=>`<section class="slide section"><div class="page"><div class="sectionNo">${esc(p.no)}</div><div class="sectionTitle">${chk(p.title,10,"title")}</div><div class="sectionLead">${chk(p.lead,16,"body")}</div></div><div class="pageNo">3 / 10</div></section>`;
const statement=p=>`<section class="slide statement"><div class="page"><div class="statWrap"><div class="statBox"><div class="display">${p.main.split("/").map(x=>esc(x.trim())).join("<br>")}</div><div class="caption">${esc(p.note)}</div></div></div></div><div class="pageNo">4 / 10</div></section>`;
const bullets=p=>`<section class="slide"><div class="page"><div class="title">${chk(p.title,10,"title")}</div><div class="bottom"></div><div class="page" style="padding-top:236px"><div class="bullets">${p.items.map(([a,b])=>`<div class="bullet card"><span class="label strong">${esc(a)}</span><div class="body">${esc(b)}</div></div>`).join("")}</div></div><div class="pageNo">5 / 10</div></section>`;
const data=p=>`<section class="slide"><div class="page"><div class="bottom"></div><div class="page" style="padding-top:236px"><div class="dataGrid">${p.items.map(([m,l],i)=>`<div class="dataCard card"><div class="metric${i===p.hot?" hot":""}">${esc(m)}</div><div class="heading">${esc(l)}</div></div>`).join("")}</div></div><div class="pageNo">6 / 10</div></section>`;
const chart=p=>{let mx=Math.max(...p.values),bw=120,g=120,base=440,t=70,svg=p.values.map((v,i)=>{let h=v/mx*(base-70),x=150+i*(bw+g),y=base-h,c=i===0?DATA.accent:"#d4d4d8";return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="18" fill="${c}"/><text x="${x+bw/2}" y="${y-18}" text-anchor="middle" font-size="30" fill="#71717a">${v}</text><text x="${x+bw/2}" y="${base+54}" text-anchor="middle" font-size="38" fill="#3f3f46">${esc(p.labels[i])}</text>`}).join("");return`<section class="slide"><div class="page"><div class="title">${chk(p.title,18,"title")}</div><div class="bottom"></div><div class="page" style="padding-top:236px"><div class="card chartBox"><svg class="chartSvg" viewBox="0 0 960 ${610+t}" xmlns="http://www.w3.org/2000/svg"><line x1="120" y1="${40+t}" x2="120" y2="${500+t}" stroke="#e5e7eb" stroke-width="2"/><line x1="120" y1="${500+t}" x2="860" y2="${500+t}" stroke="#e5e7eb" stroke-width="2"/>${svg}</svg><div class="caption">${esc(p.note)}</div></div></div><div class="pageNo">7 / 10</div></section>`};
const compare=p=>`<section class="slide"><div class="page"><div class="bottom"></div><div class="page" style="padding-top:236px"><div class="compareGrid">${[[p.leftTitle,p.left],[p.rightTitle,p.right]].map((x,i)=>`<div class="compareCol card ${i?"right":""}"><h3>${esc(x[0])}</h3><ul>${x[1].map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")}</div><div class="compareFoot">${esc(p.note)}</div></div><div class="pageNo">8 / 10</div></section>`;
const split=p=>`<section class="slide"><div class="page"><div class="title">${chk(p.title,12,"title")}</div><div class="bottom"></div><div class="page" style="padding-top:236px"><div class="splitGrid"><div class="splitArt card"><div class="splitPh">此处放三张卡片截图</div></div><div>${p.lines.map(t=>`<div class="body">${esc(t)}</div>`).join("")}</div></div></div><div class="pageNo">9 / 10</div></section>`;
const ending=p=>`<section class="slide ending"><div class="page"><div class="endingMain">${chk(p.main,10,"display")}</div><div class="endingSub">${chk(p.sub,26,"heading")}</div><div class="endingLink">${esc(p.link)}</div></div><div class="pageNo">10 / 10</div></section>`;
const f={cover,toc,section,statement:statement,bullets,data,chart,compare,split,ending,team:()=>`<section class="slide"><div class="page"><div class="title">Team</div></div></section>`};
document.getElementById("deck").innerHTML=DATA.pages.map(p=>f[p.type](p)).join("");
const fit=()=>{let s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform=`scale(${s})`;deck.style.width="1920px";deck.style.height="1080px"};addEventListener("resize",fit);fit();
</script><style>@page{size:1920px 1080px;margin:0}section.slide{page-break-after:always}</style></body></html>
